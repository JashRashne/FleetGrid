<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Emerald / Cyan Brand Gradient -->
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Subtle Navigation Grid Lines -->
  <path d="M12 24 H52 M12 40 H52 M24 12 V52 M40 12 V52" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Curved Route Line -->
  <path d="M14 46 C24 46, 26 22, 38 22 C46 22, 48 30, 52 30" stroke="url(#mintGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Stylized Modern Truck Profile (Vector) -->
  <g filter="url(#glow)">
    <!-- Cab Body -->
    <path d="M16 38 H22 L26 30 H36 V38 H46 V30 C46 28.9 45.1 28 44 28 H38 L34 22 H24 C22.9 22 22 22.9 22 24 V32 H16 C14.9 32 14 32.9 14 34 V36 C14 37.1 14.9 38 16 38 Z" fill="url(#mintGrad)" />
    
    <!-- Windshield -->
    <path d="M25 24.5 H33 V29 H28 Z" fill="#0f172a" opacity="0.9" />

    <!-- Wheels -->
    <circle cx="21" cy="38" r="4.5" fill="#0f172a" stroke="url(#glowGrad)" stroke-width="2" />
    <circle cx="21" cy="38" r="1.5" fill="#34d399" />

    <circle cx="39" cy="38" r="4.5" fill="#0f172a" stroke="url(#glowGrad)" stroke-width="2" />
    <circle cx="39" cy="38" r="1.5" fill="#38bdf8" />
  </g>

  <!-- Waypoint Pulse Pin -->
  <g transform="translate(43, 14)">
    <circle cx="5" cy="5" r="4" fill="#10b981" />
    <circle cx="5" cy="5" r="2" fill="#ffffff" />
    <circle cx="5" cy="5" r="6" stroke="#34d399" stroke-width="1" opacity="0.6" />
  </g>
</svg>
